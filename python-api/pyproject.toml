[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcrho-api"
version = "0.2.1"
description = "Python API for scripting ArcRho project and DFM workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Xiao Wei" }
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/arcrho_api", "src/arcrho_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/arcrho_project_duplication_contract.py" = "arcrho_project_duplication_contract.py"
"src/arcrho_engine_job_lease.py" = "arcrho_engine_job_lease.py"
"src/arcrho_dependent_propagation_contract.py" = "arcrho_dependent_propagation_contract.py"
"src/arcrho_engine_save_contract.py" = "arcrho_engine_save_contract.py"
"src/arcrho_hosted_save_http_contract.py" = "arcrho_hosted_save_http_contract.py"
"src/arcrho_workspace_read_contract.py" = "arcrho_workspace_read_contract.py"
"src/arcrho_workspace_mutation_contract.py" = "arcrho_workspace_mutation_contract.py"
