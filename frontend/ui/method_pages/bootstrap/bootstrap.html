<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/ui/shared/services/color_theme.js?v=20260923c"></script>
  <title>Bootstrap</title>
  <link rel="stylesheet" href="/ui/shared/tabbed_page/tabbed_page.css?v=20260824d">
  <link rel="stylesheet" href="/ui/shared/tabs/details/details_form_layout.css?v=20260820b">
  <link rel="stylesheet" href="/ui/shared/styles/dependency_families.css?v=20261020a">
  <link rel="stylesheet" href="/ui/shared/tabs/details/details_dependencies.css?v=20261021f">
  <link rel="stylesheet" href="/ui/shared/tabs/notes/notes_tab.css?v=20260911a">
  <link rel="stylesheet" href="/ui/shared/components/spreadsheet/spreadsheet_table.css?v=20260927c">
  <link rel="stylesheet" href="/ui/shared/components/spreadsheet/table_colors_window.css?v=20261003a">
  <link rel="stylesheet" href="/ui/shared/components/context_menu/context_menu.css?v=20260802a">
  <link rel="stylesheet" href="/ui/shared/styles/framed_scrollbars.css?v=20260824a">
  <link rel="stylesheet" href="/ui/shared/components/virtual_rows/virtual_rows.css?v=20260924a">
  <link rel="stylesheet" href="/ui/method_pages/bootstrap/bootstrap.css?v=20260927b">
  <link rel="stylesheet" href="/ui/shared/styles/themes/light.css?v=20260923c">
  <link rel="stylesheet" href="/ui/shared/styles/themes/dark.css?v=20260923c">
  <link rel="stylesheet" href="/ui/shared/styles/themes/revolutionary.css?v=20260923c">
</head>
<body data-arcrho-page-hold="1">
  <main class="bstShell">
    <section class="bstTabbed" id="bstTabbedPage">
      <div class="bstPageHost ar-framed-scroll">
        <section class="bstPage arDetailsRoot" id="bstDetailsPage" data-page="details" role="tabpanel">
          <div class="arDetailsSection">
            <div class="arDetailsGrid">
              <label class="arDetailsLabel" for="bstNameInput">Name : </label>
              <div class="bstFieldControl arDetailsField">
                <input class="bstInput arDetailsControl" id="bstNameInput" type="text" autocomplete="off">
              </div>
              <label class="arDetailsLabel" for="bstOutputTypeInput">Output Type : </label>
              <div class="bstFieldControl arDetailsField withPicker">
                <input class="bstInput arDetailsControl" id="bstOutputTypeInput" type="text" readonly>
                <button class="bstIconButton" id="bstOutputTypeBtn" type="button" aria-label="Select output type">...</button>
              </div>
              <label class="arDetailsLabel" data-details-field="project" for="bstProjectInput">Project : </label>
              <div class="bstFieldControl arDetailsField" data-details-field="project">
                <input class="bstInput arDetailsControl" id="bstProjectInput" type="text" readonly>
              </div>
              <label class="arDetailsLabel" for="bstClassInput">Segment : </label>
              <div class="bstFieldControl arDetailsField">
                <input class="bstInput arDetailsControl" id="bstClassInput" type="text" readonly>
              </div>
            </div>
          </div>

          <div class="arDetailsSection">
            <div class="arDetailsGrid">
              <!-- The DFM is chosen on the Data Flow map. -->
              <label class="arDetailsLabel" id="bstDependenciesLabel">Data Flow : </label>
              <div class="arDetailsField">
                <div id="bstDependencyMap" class="arDetailsDepMap" role="group" aria-labelledby="bstDependenciesLabel" aria-live="polite"></div>
              </div>
            </div>
          </div>

          <div class="arDetailsSection">
            <div class="arDetailsGrid">
              <label class="arDetailsLabel" for="bstOriginLengthInput">Origin Length : </label>
              <div class="bstFieldControl arDetailsField arDetailsShortField">
                <input class="bstInput arDetailsControl" id="bstOriginLengthInput" type="text" readonly>
              </div>
              <label class="arDetailsLabel" for="bstDevelopmentLengthInput">Development Length : </label>
              <div class="bstFieldControl arDetailsField arDetailsShortField">
                <input class="bstInput arDetailsControl" id="bstDevelopmentLengthInput" type="text" readonly>
              </div>
              <label class="arDetailsLabel" id="bstModelLabel">Model : </label>
              <div class="arDetailsField">
                <div class="bstSegmented" id="bstModelControl" role="radiogroup" aria-labelledby="bstModelLabel"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="bstPage" id="bstResidualsPage" data-page="residuals" role="tabpanel">
          <div class="bstTableBlock">
            <div class="bstToolbar">
              <div class="bstToolGroup">
                <span class="bstToolTitle">Residuals</span>
                <div class="bstToolControls">
                  <span class="bstToolField">
                    <label class="bstToolLabel" for="bstResidualTypeButton">Type : </label>
                    <button class="bstDropdownButton bstResidualTypeButton" id="bstResidualTypeButton" type="button" aria-haspopup="listbox" aria-expanded="false">
                      <span class="bstDropdownValue"></span><span class="bstDropdownCaret" aria-hidden="true"></span>
                    </button>
                  </span>
                </div>
              </div>
              <div class="bstToolGroup">
                <span class="bstToolTitle">Scale Values</span>
                <div class="bstToolControls">
                  <span class="bstToolField">
                    <label class="bstToolLabel" for="bstResidualSmoothingInput">Residual Smoother : </label>
                    <input class="bstNumberInput" id="bstResidualSmoothingInput" type="text" inputmode="decimal" autocomplete="off">
                  </span>
                  <span class="bstToolField">
                    <label class="bstToolLabel" for="bstForecastSmoothingInput">Forecast Smoother : </label>
                    <input class="bstNumberInput" id="bstForecastSmoothingInput" type="text" inputmode="decimal" autocomplete="off">
                  </span>
                  <label class="bstToolCheck"><input id="bstShowScaleInput" type="checkbox"> Show Scale Values</label>
                </div>
              </div>
            </div>
            <div class="bstResidualsSplit">
              <div class="bstResidualsGridColumn">
                <div class="ar-framed-scroll bstTableWrap">
                  <table class="arSpreadsheetTable bstTable bstResidualTable" aria-label="Bootstrap residuals">
                    <thead id="bstResidualHead"></thead>
                    <tbody id="bstResidualBody"></tbody>
                  </table>
                </div>
                <p class="bstCaption" id="bstResidualCaption"></p>
              </div>
              <section class="bstChartPanel" aria-labelledby="bstResidualChartTitle">
                <header class="bstChartHeader">
                  <h2 class="bstChartTitle" id="bstResidualChartTitle">Residuals By Development Period</h2>
                </header>
                <div class="bstChartPlot">
                  <canvas class="bstChartCanvas" id="bstResidualChart" role="img" aria-label="Residuals by development period"></canvas>
                </div>
              </section>
            </div>
          </div>
          <div class="bstEmpty" id="bstResidualsEmpty" hidden>Choose a DFM and simulate to fit the model.</div>
        </section>

        <section class="bstPage arDetailsRoot" id="bstSimulationPage" data-page="simulation" role="tabpanel">
          <div class="arDetailsSection">
            <div class="arDetailsGrid">
              <label class="arDetailsLabel" for="bstSimulationCountInput">Simulations : </label>
              <div class="bstFieldControl arDetailsField bstMediumField">
                <input class="bstInput arDetailsControl bstNumericText" id="bstSimulationCountInput" type="text" inputmode="numeric" autocomplete="off">
              </div>
              <label class="arDetailsLabel" for="bstSeedInput">Random Seed : </label>
              <div class="arDetailsField bstInlineField">
                <div class="bstFieldControl bstMediumField">
                  <input class="bstInput arDetailsControl bstNumericText" id="bstSeedInput" type="text" inputmode="numeric" autocomplete="off">
                </div>
                <button class="bstButton" id="bstNewSeedBtn" type="button">New Seed</button>
              </div>
            </div>
          </div>
          <div class="arDetailsSection">
            <div class="arDetailsGrid">
              <label class="arDetailsLabel" for="bstEstimationButton">Pseudo Data Distribution : </label>
              <div class="arDetailsField bstMediumWideField">
                <button class="bstDropdownButton" id="bstEstimationButton" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <span class="bstDropdownValue"></span><span class="bstDropdownCaret" aria-hidden="true"></span>
                </button>
              </div>
              <label class="arDetailsLabel" for="bstProcessButton">Forecast Distribution : </label>
              <div class="arDetailsField bstMediumWideField">
                <button class="bstDropdownButton" id="bstProcessButton" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <span class="bstDropdownValue"></span><span class="bstDropdownCaret" aria-hidden="true"></span>
                </button>
              </div>
              <label class="arDetailsLabel" for="bstPreventNegativeInput">Prevent Negative Cumulative Data : </label>
              <div class="arDetailsField">
                <input class="bstCheckbox" id="bstPreventNegativeInput" type="checkbox">
              </div>
            </div>
          </div>
          <div class="arDetailsSection">
            <div class="arDetailsGrid">
              <label class="arDetailsLabel" for="bstNegativeMeanButton">Negative Mean, Gamma Or Log Normal : </label>
              <div class="arDetailsField bstMediumWideField">
                <button class="bstDropdownButton" id="bstNegativeMeanButton" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <span class="bstDropdownValue"></span><span class="bstDropdownCaret" aria-hidden="true"></span>
                </button>
              </div>
              <label class="arDetailsLabel" for="bstOdpNegativeMeanButton">Negative Mean, Over-dispersed Poisson : </label>
              <div class="arDetailsField bstMediumWideField">
                <button class="bstDropdownButton" id="bstOdpNegativeMeanButton" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <span class="bstDropdownValue"></span><span class="bstDropdownCaret" aria-hidden="true"></span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <section class="bstPage" id="bstTargetsPage" data-page="targets" role="tabpanel">
          <div class="bstTableBlock">
            <div class="bstToolbar">
              <div class="bstToolGroup bstTargetPickerGroup">
                <span class="bstToolTitle">Target</span>
                <div class="bstToolControls">
                  <span class="bstToolField bstTargetField">
                    <label class="bstToolLabel" for="bstTargetInput">Target Ultimate : </label>
                    <span class="bstFieldControl withPicker">
                      <input class="bstInput bstToolInput" id="bstTargetInput" type="text" readonly>
                      <button class="bstIconButton" id="bstTargetBtn" type="button" aria-label="Select target ultimate">...</button>
                    </span>
                    <button class="bstLinkButton" id="bstTargetClearBtn" type="button">Clear</button>
                  </span>
                </div>
              </div>
            </div>
            <div class="ar-framed-scroll bstTableWrap bstTargetsWrap">
              <table class="arSpreadsheetTable bstTable bstTargetsTable" aria-label="Bootstrap targets">
                <thead id="bstTargetsHead"></thead>
                <tbody id="bstTargetsBody"></tbody>
              </table>
            </div>
            <p class="bstCaption" id="bstTargetsCaption"></p>
          </div>
        </section>

        <section class="bstPage" id="bstResultsPage" data-page="results" role="tabpanel">
          <div class="bstResultsBody bstTableBlock" id="bstResultsBody" hidden>
            <div class="bstToolbar">
              <div class="bstToolGroup">
                <span class="bstToolTitle">View</span>
                <div class="bstToolControls">
                  <div class="bstSegmented bstSegmentedCompact" id="bstBasisControl" role="radiogroup" aria-label="Scaled or unscaled results"></div>
                  <div class="bstSegmented bstSegmentedCompact" id="bstMeasureControl" role="radiogroup" aria-label="Reserves or ultimates"></div>
                </div>
              </div>
              <div class="bstToolGroup">
                <span class="bstToolTitle">Percentiles</span>
                <div class="bstToolControls">
                  <input class="bstInput bstToolInput bstPercentileInput" id="bstPercentileInput" type="text" autocomplete="off"
                    spellcheck="false" aria-label="Chosen percentiles">
                  <button class="bstLinkButton" id="bstPercentileResetBtn" type="button">Default</button>
                  <label class="bstToolCheck"><input id="bstFullLadderInput" type="checkbox"> Full Ladder</label>
                  <button class="bstDropdownButton bstIntervalButton" id="bstIntervalButton" type="button" aria-haspopup="listbox"
                    aria-expanded="false" aria-label="Full ladder interval">
                    <span class="bstDropdownValue"></span><span class="bstDropdownCaret" aria-hidden="true"></span>
                  </button>
                </div>
              </div>
              <div class="bstTableActions">
                <button class="bstTableAction" id="bstCopyResultsBtn" type="button" data-label="Copy Table" data-done-label="Copied">
                  <span class="bstTableActionIcon" data-icon="copy" aria-hidden="true"></span><span class="bstTableActionLabel">Copy Table</span>
                </button>
                <button class="bstTableAction" id="bstDownloadResultsBtn" type="button" data-label="Download CSV" data-done-label="Saved">
                  <span class="bstTableActionIcon" data-icon="download" aria-hidden="true"></span><span class="bstTableActionLabel">Download CSV</span>
                </button>
              </div>
            </div>
            <div class="bstNotice" id="bstResultsStale" hidden>
              <span>The inputs changed since this run, so these results describe the earlier settings.</span>
              <button class="bstButton primary bstToolButton" id="bstStaleSimulateBtn" type="button">Simulate</button>
            </div>
            <div class="bstResultsFrame">
              <div class="ar-framed-scroll bstTableWrap bstResultsWrap">
                <table class="arSpreadsheetTable bstTable bstResultsTable" aria-label="Bootstrap results">
                  <thead id="bstResultsHead"></thead>
                  <tbody id="bstResultsTableBody"></tbody>
                </table>
              </div>
            </div>
            <p class="bstCaption" id="bstResultsCaption"></p>
            <div class="bstResultsCharts">
              <section class="bstChartPanel" aria-labelledby="bstDistributionTitle">
                <header class="bstChartHeader">
                  <h2 class="bstChartTitle" id="bstDistributionTitle">Distribution Of Total Reserve</h2>
                  <div class="bstChartLegend" aria-hidden="true">
                    <span class="bstChartLegendItem"><span class="bstChartLegendSwatch bstSwatchMeanLine"></span>Mean</span>
                    <span class="bstChartLegendItem"><span class="bstChartLegendSwatch bstSwatchMarkerLine"></span>Chosen Percentiles</span>
                  </div>
                </header>
                <div class="bstChartPlot">
                  <canvas class="bstChartCanvas" id="bstDistributionChart" role="img" aria-label="Distribution chart"></canvas>
                  <div class="bstChartEmpty" id="bstDistributionEmpty" hidden></div>
                  <div class="bstChartTooltip" id="bstDistributionTooltip" hidden></div>
                </div>
              </section>
              <section class="bstChartPanel" aria-labelledby="bstFanTitle">
                <header class="bstChartHeader">
                  <h2 class="bstChartTitle" id="bstFanTitle">Reserves By Origin</h2>
                  <div class="bstChartLegend" id="bstFanLegend" aria-hidden="true"></div>
                </header>
                <div class="bstChartPlot">
                  <canvas class="bstChartCanvas" id="bstFanChart" role="img" aria-label="Fan chart"></canvas>
                  <div class="bstChartEmpty" id="bstFanEmpty" hidden></div>
                  <div class="bstChartTooltip" id="bstFanTooltip" hidden></div>
                </div>
              </section>
            </div>
          </div>
          <div class="bstEmpty" id="bstResultsEmpty">
            <div class="bstEmptyContent">
              <span id="bstResultsEmptyText">Not run yet.</span>
              <button class="bstButton primary" id="bstEmptySimulateBtn" type="button">Simulate</button>
            </div>
          </div>
        </section>

        <section class="bstPage" id="bstNotesPage" data-page="notes" role="tabpanel">
          <div id="bstNotesMount"></div>
        </section>

        <section class="bstPage" id="bstAuditPage" data-page="audit" role="tabpanel">
          <div id="bstAuditLogMount"></div>
        </section>
      </div>
    </section>

    <!-- The run sits beside Save and Cancel; its state shows beside the window
         title, which Project Instance draws. -->
    <footer class="bstSaveBar" id="bstSaveBar">
      <div class="bstSaveActions">
        <button class="bstButton primary bstRunButton" id="bstSimulateBtn" type="button">Simulate</button>
        <button class="bstButton primary" id="bstSaveBtn" type="button">Save</button>
        <button class="bstButton" id="bstCancelBtn" type="button">Cancel</button>
      </div>
    </footer>
  </main>

  <div class="bstMenu" id="bstMenu" role="listbox" hidden></div>
  <!-- The cell context menu the other method grids offer. -->
  <div id="bstCellContextMenu" class="ctx-menu" role="menu" style="display:none;">
    <div class="ctx-menu-inner">
      <button class="ctx-item" type="button" data-action="copy_value">Copy values</button>
      <button class="ctx-item" type="button" data-action="remove_highlights">Remove Highlights</button>
      <div class="ctx-sep"></div>
      <button class="ctx-item" type="button" data-action="table_colors" data-table-colors></button>
    </div>
  </div>

  <script src="/ui/shared/tabbed_page/initial_tab_paint.js?v=20260824d" data-auto="1"></script>
  <script type="module" src="/ui/method_pages/bootstrap/bootstrap_main.js?v=20261020a"></script>
</body>
</html>
