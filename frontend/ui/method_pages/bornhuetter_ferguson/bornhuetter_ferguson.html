<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/ui/shared/services/color_theme.js?v=20260923c"></script>
  <title>Bornhuetter Ferguson</title>
  <link rel="stylesheet" href="/ui/shared/tabbed_page/tabbed_page.css?v=20260824d">
  <link rel="stylesheet" href="/ui/shared/tabs/details/details_form_layout.css?v=20260820b">
<link rel="stylesheet" href="/ui/shared/styles/dependency_families.css?v=20261020a">
<link rel="stylesheet" href="/ui/shared/tabs/details/details_dependencies.css?v=20261020c">
  <link rel="stylesheet" href="/ui/shared/tabs/notes/notes_tab.css?v=20260911a">
  <link rel="stylesheet" href="/ui/shared/components/spreadsheet/spreadsheet_table.css?v=20260927c">
  <link rel="stylesheet" href="/ui/shared/components/spreadsheet/table_colors_window.css?v=20261003a">
  <link rel="stylesheet" href="/ui/method_pages/bornhuetter_ferguson/bornhuetter_ferguson.css?v=20260927a"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/light.css?v=20260923c">
  <link rel="stylesheet" href="/ui/shared/styles/themes/dark.css?v=20260923c">
  <link rel="stylesheet" href="/ui/shared/styles/themes/revolutionary.css?v=20260923c">
</head>
<body data-arcrho-page-hold="1">
  <main class="bfShell">
    <section class="bfTabbed" id="bfTabbedPage">
      <div class="bfPageHost">
        <section class="bfPage arDetailsRoot" id="bfDetailsPage" data-page="details" role="tabpanel">
          <div class="bfDetailsStack">
            <!-- Identity, then the datasets this method is built from, then the
                 shape of its output. Name is the first row and Output Type the
                 second, as on every Details tab. -->
            <section class="bfPanel">
              <div class="bfPanelBody">
                <div class="arDetailsSection">
                  <div class="bfFieldGrid arDetailsGrid">
                    <label class="bfLabel arDetailsLabel" for="bfNameInput">Name : </label>
                    <div class="bfFieldControl arDetailsField">
                      <input class="bfInput arDetailsControl" id="bfNameInput" type="text">
                    </div>
                    <label class="bfLabel arDetailsLabel" for="bfOutputTypeInput">Output Type : </label>
                    <div class="bfFieldControl arDetailsField withPicker">
                      <input class="bfInput arDetailsControl" id="bfOutputTypeInput" type="text">
                      <button class="bfIconButton" id="bfOutputTypeBtn" type="button" title="Select output type" aria-label="Select output type">...</button>
                    </div>
                    <label class="bfLabel arDetailsLabel" data-details-field="project" for="bfProjectInput">Project : </label>
                    <div class="bfFieldControl arDetailsField" data-details-field="project">
                      <input class="bfInput arDetailsControl" id="bfProjectInput" type="text" readonly>
                    </div>
                    <label class="bfLabel arDetailsLabel" for="bfClassInput">Segment : </label>
                    <div class="bfFieldControl arDetailsField">
                      <input class="bfInput arDetailsControl" id="bfClassInput" type="text" readonly>
                    </div>
                  </div>
                </div>

                <div class="arDetailsSection">
                  <div class="bfFieldGrid arDetailsGrid">
                    <label class="bfLabel arDetailsLabel" for="bfLatestInput">Latest : </label>
                    <div class="bfFieldControl arDetailsField withPicker">
                      <input class="bfInput arDetailsControl" id="bfLatestInput" type="text" readonly>
                      <button class="bfIconButton" id="bfLatestBtn" type="button" title="Select latest" aria-label="Select latest">...</button>
                    </div>
                    <label class="bfLabel arDetailsLabel" for="bfDfmInput">Development Pattern : </label>
                    <div class="bfFieldControl arDetailsField withPicker">
                      <input class="bfInput arDetailsControl" id="bfDfmInput" type="text" readonly>
                      <button class="bfIconButton" id="bfDfmBtn" type="button" title="Select development pattern" aria-label="Select development pattern">...</button>
                    </div>
                    <label class="bfLabel arDetailsLabel bfPriorLabel" for="bfPriorAddBtn">Prior Vector : </label>
                    <div class="bfFieldControl arDetailsField bfPriorPicker">
                      <div class="bfPriorList" id="bfPriorList" role="list" aria-label="Selected prior vectors"></div>
                    </div>
                    <label class="arDetailsLabel" id="bfDependenciesLabel">Dependencies : </label>
                    <div class="arDetailsField">
                      <div id="bfDependencyMap" class="arDetailsDepMap" role="group" aria-labelledby="bfDependenciesLabel" aria-live="polite"></div>
                    </div>
                  </div>
                </div>

                <div class="arDetailsSection">
                  <div class="bfFieldGrid arDetailsGrid">
                    <label class="bfLabel arDetailsLabel" for="bfOriginLengthButton">Origin Length : </label>
                    <div class="bfFieldControl arDetailsField arDetailsShortField">
                      <div class="bfOriginLengthDropdown" id="bfOriginLengthDropdown">
                        <input id="bfOriginLengthInput" type="hidden" value="12">
                        <button class="bfDropdownButton bfOriginLengthButton" id="bfOriginLengthButton" type="button" aria-haspopup="listbox" aria-controls="bfOriginLengthMenu" aria-expanded="false">
                          <span id="bfOriginLengthLabel">12</span>
                          <span class="bfDropdownCaret" aria-hidden="true"></span>
                        </button>
                        <div class="bfDropdownMenu" id="bfOriginLengthMenu" role="listbox" aria-label="Origin Length">
                          <button class="bfDropdownOption" type="button" role="option" data-value="12" aria-selected="true">12</button>
                          <button class="bfDropdownOption" type="button" role="option" data-value="6" aria-selected="false">6</button>
                          <button class="bfDropdownOption" type="button" role="option" data-value="3" aria-selected="false">3</button>
                          <button class="bfDropdownOption" type="button" role="option" data-value="1" aria-selected="false">1</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </section>

        <section class="bfPage" id="bfMethodPage" data-page="method" role="tabpanel">
          <div class="bfMethodToolbar">
            <div class="bfToolGroup">
              <span class="bfToolTitle">Weights</span>
              <div class="bfToolControls">
                <label class="bfToolCheck"><input id="bfShowWeightsInput" type="checkbox" checked> Show Weights</label>
                <div class="bfToolFormatControl">
                  <label class="bfToolControlLabel" for="bfWeightDisplayButton">Format : </label>
                  <div id="bfWeightDisplayDropdown" class="bfWeightDisplayDropdown">
                    <button id="bfWeightDisplayButton" class="bfDropdownButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Weight display mode">
                      <span id="bfWeightDisplayLabel">Index</span>
                      <span class="bfDropdownCaret" aria-hidden="true"></span>
                    </button>
                    <div id="bfWeightDisplayMenu" class="bfDropdownMenu" role="listbox" aria-label="Weight display mode">
                      <button class="bfDropdownOption" type="button" role="option" data-value="actual" aria-selected="true">Index</button>
                      <button class="bfDropdownOption" type="button" role="option" data-value="effective" aria-selected="false">Effective %</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="bfToolGroup">
              <span class="bfToolTitle">Statistics</span>
              <div class="bfToolControls">
                <div class="bfToolDecimalControl">
                  <label class="bfToolControlLabel" for="bfMethodDecimalsInput">Decimal : </label>
                  <span class="bfNumberStepper">
                    <input id="bfMethodDecimalsInput" class="bfStepperInput" type="number" min="0" max="8" step="1" value="1">
                    <span class="bfStepperButtons">
                      <button id="bfMethodDecimalsUp" class="bfStepperBtn" type="button" aria-label="Increase decimal places"><span class="bfStepperCaret bfStepperCaretUp" aria-hidden="true"></span></button>
                      <button id="bfMethodDecimalsDown" class="bfStepperBtn" type="button" aria-label="Decrease decimal places"><span class="bfStepperCaret" aria-hidden="true"></span></button>
                    </span>
                  </span>
                </div>
              </div>
            </div>
          </div>
          <div class="bfTableWrap">
            <table class="bfMethodTable arSpreadsheetTable" aria-label="Bornhuetter Ferguson method table" tabindex="0">
              <colgroup id="bfMethodCols"></colgroup>
              <thead id="bfMethodHead"></thead>
              <tbody id="bfMethodGrid"></tbody>
            </table>
          </div>
        </section>

        <section class="bfPage" id="bfChartPage" data-page="chart" role="tabpanel">
          <section class="bfChartPanel" aria-labelledby="bfChartTitle">
            <header class="bfChartHeader">
              <div class="bfChartHeading">
                <h2 class="bfChartTitle" id="bfChartTitle">Projected Ultimates</h2>
                <p class="bfChartSubtitle">Ultimate values by origin period</p>
              </div>
              <div class="bfChartLegend" id="bfChartLegend" aria-label="Chart legend"></div>
            </header>
            <div class="bfChartPlot">
              <canvas class="bfChartCanvas" id="bfChartCanvas" role="img"></canvas>
              <div class="bfChartEmpty" id="bfChartEmpty">Select source data to plot ultimate values.</div>
              <div class="bfChartTooltip" id="bfChartTooltip" role="status" hidden></div>
            </div>
          </section>
        </section>

        <section class="bfPage" id="bfNotesPage" data-page="notes" role="tabpanel">
          <div id="bfNotesMount"></div>
        </section>

        <section class="bfPage" id="bfAuditPage" data-page="audit" role="tabpanel">
          <div id="bfAuditLogMount"></div>
        </section>
      </div>
    </section>

    <footer class="bfSaveBar" id="bfSaveBar">
      <div class="bfSaveActions">
        <button class="bfButton primary" id="bfSaveBtn" type="button">Save</button>
        <button class="bfButton" id="bfCancelBtn" type="button">Cancel</button>
      </div>
    </footer>
  </main>

  <div class="bfCellContextMenu" id="bfCellContextMenu" role="menu" aria-hidden="true">
    <button type="button" role="menuitem" data-bf-cell-action="copy">Copy values</button>
    <button type="button" role="menuitem" data-bf-cell-action="paste">Paste values</button>
    <button type="button" role="menuitem" data-bf-cell-action="remove-highlights">Remove Highlights</button>
    <button type="button" role="menuitem" data-bf-cell-action="table-colors" data-table-colors></button>
  </div>

  <div class="bfCellContextMenu bfPriorContextMenu" id="bfPriorContextMenu" role="menu" aria-hidden="true">
    <button type="button" role="menuitem" data-bf-prior-action="delete">Delete</button>
  </div>

  <script src="/ui/shared/tabbed_page/initial_tab_paint.js?v=20260824d" data-auto="1"></script>
  <script type="module" src="/ui/method_pages/bornhuetter_ferguson/bornhuetter_ferguson_main.js?v=20261020a"></script>
</body>
</html>
