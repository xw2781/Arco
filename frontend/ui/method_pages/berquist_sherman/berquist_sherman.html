<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/ui/shared/services/color_theme.js?v=20260923c"></script>
  <title>Berquist Sherman</title>
  <link rel="stylesheet" href="/ui/shared/tabbed_page/tabbed_page.css?v=20260824d">
  <link rel="stylesheet" href="/ui/shared/tabs/details/details_form_layout.css?v=20260820b">
<link rel="stylesheet" href="/ui/shared/styles/dependency_families.css?v=20261020a">
<link rel="stylesheet" href="/ui/shared/tabs/details/details_dependencies.css?v=20261021f">
  <link rel="stylesheet" href="/ui/shared/tabs/notes/notes_tab.css?v=20260911a">
  <link rel="stylesheet" href="/ui/shared/tabs/links/links_tab.css?v=20260901b">
  <link rel="stylesheet" href="/ui/shared/tabs/audit_log/audit_log.css?v=20260714a">
  <link rel="stylesheet" href="/ui/shared/components/spreadsheet/spreadsheet_table.css?v=20260927c">
  <link rel="stylesheet" href="/ui/shared/components/spreadsheet/table_colors_window.css?v=20261003a">
  <link rel="stylesheet" href="/ui/shared/components/spreadsheet/numeric_stepper.css?v=20260802a">
  <link rel="stylesheet" href="/ui/shared/components/pickers/picker_fields.css?v=20260820b">
  <link rel="stylesheet" href="/ui/shared/components/pickers/number_format_field.css?v=20260914a">
  <link rel="stylesheet" href="/ui/shared/components/context_menu/context_menu.css?v=20260802a">
  <link rel="stylesheet" href="/ui/method_pages/berquist_sherman/berquist_sherman.css?v=20260927a">
  <link rel="stylesheet" href="/ui/shared/styles/themes/light.css?v=20260923c">
  <link rel="stylesheet" href="/ui/shared/styles/themes/dark.css?v=20260923c">
  <link rel="stylesheet" href="/ui/shared/styles/themes/revolutionary.css?v=20260923c">
</head>
<body data-arcrho-page-hold="1">
  <main class="bsShell">
    <section class="bsTabbed" id="bsTabbedPage">
      <div class="bsPageHost">
        <section class="bsPage arDetailsRoot" id="bsDetailsPage" data-page="details" role="tabpanel">
          <div class="bsDetailsStack">
            <!-- Identity, then the Data Flow map where the selected variant's
                 source datasets are chosen, then the shape and precision of the
                 output, then its number format.
                 Name is the first row and Output Type the second, as on every
                 Details tab. -->
            <section class="bsPanel arDetailsSection">
              <div class="bsPanelBody">
                <div class="bsFieldGrid arDetailsGrid">
                  <label class="bsLabel arDetailsLabel" for="bsNameInput">Name : </label>
                  <div class="bsFieldControl arDetailsField">
                    <input class="bsInput arDetailsControl" id="bsNameInput" type="text">
                  </div>
                  <label class="bsLabel arDetailsLabel" for="bsOutputTypeInput">Output Type : </label>
                  <div class="bsFieldControl arDetailsField withPicker">
                    <input class="bsInput arDetailsControl" id="bsOutputTypeInput" type="text">
                    <button class="bsIconButton" id="bsOutputTypeBtn" type="button" aria-label="Select output type">...</button>
                  </div>
                  <label class="bsLabel arDetailsLabel" data-details-field="project" for="bsProjectInput">Project : </label>
                  <div class="bsFieldControl arDetailsField" data-details-field="project">
                    <input class="bsInput arDetailsControl" id="bsProjectInput" type="text" readonly>
                  </div>
                  <label class="bsLabel arDetailsLabel" for="bsClassInput">Segment : </label>
                  <div class="bsFieldControl arDetailsField">
                    <input class="bsInput arDetailsControl" id="bsClassInput" type="text" readonly>
                  </div>
                  <label class="bsLabel arDetailsLabel" data-details-field="method_type" for="bsMethodTypeInput">Method Type : </label>
                  <div class="bsFieldControl arDetailsField" data-details-field="method_type">
                    <input class="bsInput arDetailsControl" id="bsMethodTypeInput" type="text" readonly>
                  </div>
                </div>
              </div>
            </section>

            <section class="bsPanel arDetailsSection">
              <div class="bsPanelBody">
                <div class="bsFieldGrid arDetailsGrid">
                  <label class="bsLabel arDetailsLabel" id="bsDependenciesLabel">Data Flow : </label>
                  <div class="arDetailsField">
                    <div id="bsDependencyMap" class="arDetailsDepMap" role="group" aria-labelledby="bsDependenciesLabel" aria-live="polite"></div>
                  </div>
                </div>
              </div>
            </section>

            <section class="bsPanel arDetailsSection">
              <div class="bsPanelBody">
                <div class="bsFieldGrid arDetailsGrid">
                  <label class="bsLabel arDetailsLabel" for="bsOriginLengthInput">Origin Length : </label>
                  <div class="bsFieldControl arDetailsField arDetailsShortField">
                    <input class="bsInput bsLengthInput arDetailsControl" id="bsOriginLengthInput" type="text" value="12" readonly>
                  </div>
                  <label class="bsLabel arDetailsLabel" for="bsDevelopmentLengthInput">Development Length : </label>
                  <div class="bsFieldControl arDetailsField arDetailsShortField">
                    <input class="bsInput bsLengthInput arDetailsControl" id="bsDevelopmentLengthInput" type="text" value="12" readonly>
                  </div>
                  <label class="bsLabel arDetailsLabel" for="bsDecimalPlacesInput">Decimal Places : </label>
                  <div class="bsFieldControl arDetailsField arDetailsShortField">
                    <span class="decimalPlacesWrap bsDecimalPlacesWrap">
                      <input class="bsDecimalPlacesInput" id="bsDecimalPlacesInput" type="number" min="0" max="6" step="1" inputmode="numeric" aria-label="Decimal places for calculated triangles">
                      <span class="decimalPlacesStepper">
                        <button class="decimalPlacesStepBtn" id="bsDecimalPlacesUp" type="button" aria-label="Increase decimal places"><span class="datasetStepperCaret datasetStepperCaretUp"></span></button>
                        <button class="decimalPlacesStepBtn" id="bsDecimalPlacesDown" type="button" aria-label="Decrease decimal places"><span class="datasetStepperCaret"></span></button>
                      </span>
                    </span>
                  </div>
                </div>
              </div>
            </section>

            <section class="bsPanel arDetailsSection">
              <div class="bsPanelBody">
                <div class="bsFieldGrid arDetailsGrid">
                  <!-- Governs the calculated triangles only. Each input triangle
                       keeps the number format of its own dataset instance. -->
                  <label class="bsLabel arDetailsLabel" for="bsNumberFormatInput">Number Format : </label>
                  <div class="bsFieldControl arDetailsField">
                    <div class="arNumberFormatField" id="bsNumberFormatField">
                      <input class="bsInput arDetailsControl" id="bsNumberFormatInput" type="text" autocomplete="off" aria-controls="bsNumberFormatMenu" aria-expanded="false">
                      <button class="arNumberFormatToggle" id="bsNumberFormatBtn" type="button" aria-label="Show Number Format presets" aria-controls="bsNumberFormatMenu" aria-expanded="false">
                        <span class="arNumberFormatCaret" aria-hidden="true"></span>
                      </button>
                      <div class="datasetDropdown arNumberFormatMenu" id="bsNumberFormatMenu" role="listbox" aria-label="Number Format presets"></div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </section>

        <section class="bsPage" id="bsMethodPage" data-page="method" role="tabpanel">
          <div class="bsMethodTabBar tabbedPageTabBar">
            <div class="bsViewButtons" id="bsViewButtons" role="tablist" aria-label="Calculation view"></div>
          </div>
          <!-- The nested tab strip encloses its own client area, matching the
               inner tab control in ResQ. -->
          <div class="bsMethodFrame">
            <div class="bsMethodMessage" id="bsMethodMessage" role="status"></div>
            <div class="bsGridPane" id="bsPrimaryPane">
              <div class="bsMethodCaption" id="bsMethodCaption" hidden>
                <span class="bsMethodCaptionText" id="bsMethodCaptionText"></span>
                <span class="bsMethodCaptionSpacer"></span>
                <!-- One Loess Span control moves to whichever caption owns the
                     loess estimator: Adjusted Paid Claims for Settlement Rate,
                     Current Average Case Reserves for Case Reserve Adequacy. -->
                <div class="bsLoessSpanField" id="bsLoessSpanField" hidden>
                  <span class="bsLoessSpanLabel" id="bsLoessSpanLabel">Loess Span :</span>
                  <span class="decimalPlacesWrap bsLoessSpanWrap">
                    <input class="bsLoessSpanInput" id="bsLoessSpanInput" type="number" min="2" max="99" step="1" inputmode="numeric" aria-labelledby="bsLoessSpanLabel">
                    <span class="decimalPlacesStepper">
                      <button class="decimalPlacesStepBtn" id="bsLoessSpanUp" type="button" aria-label="Increase loess span"><span class="datasetStepperCaret datasetStepperCaretUp"></span></button>
                      <button class="decimalPlacesStepBtn" id="bsLoessSpanDown" type="button" aria-label="Decrease loess span"><span class="datasetStepperCaret"></span></button>
                    </span>
                  </span>
                </div>
              </div>
              <div class="bsTableWrap" id="bsMethodTableWrap">
                <table class="bsMethodTable arSpreadsheetTable" id="bsMethodTable" aria-label="Berquist Sherman calculation table">
                  <thead id="bsMethodHead"></thead>
                  <tbody id="bsMethodBody"></tbody>
                </table>
              </div>
            </div>
            <!-- The Case Reserve Adequacy "Avg. Selections" view stacks two
                 captioned grids, as the same ResQ tab does. -->
            <div class="bsGridPane" id="bsSecondaryPane" hidden>
              <div class="bsMethodCaption" id="bsSecondaryCaption">
                <span class="bsMethodCaptionText" id="bsSecondaryCaptionText"></span>
                <span class="bsMethodCaptionSpacer"></span>
              </div>
              <div class="bsTableWrap" id="bsSecondaryTableWrap">
                <table class="bsMethodTable arSpreadsheetTable" id="bsSecondaryTable" aria-label="Berquist Sherman current average case reserves">
                  <thead id="bsSecondaryHead"></thead>
                  <tbody id="bsSecondaryBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </section>

        <section class="bsPage" id="bsNotesPage" data-page="notes" role="tabpanel">
          <div id="bsNotesMount"></div>
        </section>

        <section class="bsPage" id="bsLinksPage" data-page="links" role="tabpanel">
          <div id="bsLinksMount"></div>
        </section>

        <section class="bsPage" id="bsAuditPage" data-page="audit" role="tabpanel">
          <div id="bsAuditLogMount"></div>
        </section>
      </div>
    </section>

    <footer class="bsSaveBar" id="bsSaveBar">
      <div class="bsSaveActions">
        <button class="bsButton primary" id="bsSaveBtn" type="button">Save</button>
        <button class="bsButton" id="bsCancelBtn" type="button">Cancel</button>
      </div>
    </footer>
  </main>

  <!-- The cell context menu the Dataset Viewer and Result Selection grids
       offer. Select Leading Diagonal joins it on the Proportion Settled view. -->
  <div id="bsCellContextMenu" class="ctx-menu" role="menu" style="display:none;">
    <div class="ctx-menu-inner">
      <button class="ctx-item" type="button" data-action="copy_value">Copy values</button>
      <button class="ctx-item" type="button" data-action="remove_highlights">Remove Highlights</button>
      <button class="ctx-item" type="button" id="bsSelectLeadingDiagonalItem" data-action="select_leading_diagonal" hidden>Select Leading Diagonal</button>
        <div class="ctx-sep"></div>
        <button class="ctx-item" type="button" data-action="table_colors" data-table-colors></button>
    </div>
  </div>

  <script src="/ui/shared/tabbed_page/initial_tab_paint.js?v=20260824d" data-auto="1"></script>
  <script type="module" src="/ui/method_pages/berquist_sherman/berquist_sherman_main.js?v=20261020a"></script>
</body>
</html>
