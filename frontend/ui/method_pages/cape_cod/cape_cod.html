<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/ui/shared/services/color_theme.js?v=20260923c"></script>
  <title>Cape Cod</title>
  <link rel="stylesheet" href="/ui/shared/tabbed_page/tabbed_page.css?v=20260824d">
  <link rel="stylesheet" href="/ui/shared/tabs/details/details_form_layout.css?v=20260820b">
<link rel="stylesheet" href="/ui/shared/styles/dependency_families.css?v=20261020a">
<link rel="stylesheet" href="/ui/shared/tabs/details/details_dependencies.css?v=20261021f">
  <link rel="stylesheet" href="/ui/shared/tabs/notes/notes_tab.css?v=20260911a">
  <link rel="stylesheet" href="/ui/shared/components/spreadsheet/spreadsheet_table.css?v=20260927c">
  <link rel="stylesheet" href="/ui/shared/components/spreadsheet/table_colors_window.css?v=20261003a">
  <link rel="stylesheet" href="/ui/method_pages/cape_cod/cape_cod.css?v=20260927b"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/light.css?v=20260923c">
  <link rel="stylesheet" href="/ui/shared/styles/themes/dark.css?v=20260923c">
  <link rel="stylesheet" href="/ui/shared/styles/themes/revolutionary.css?v=20260923c">
</head>
<body data-arcrho-page-hold="1">
  <main class="ccShell">
    <section class="ccTabbed" id="ccTabbedPage">
      <div class="ccPageHost">
        <section class="ccPage arDetailsRoot" id="ccDetailsPage" data-page="details" role="tabpanel">
          <div class="ccDetailsStack">
            <!-- Identity, then the datasets the method is built from, then the
                 shape of the output. Name is the first row and Output Type the
                 second, as on every Details tab. -->
            <section class="ccPanel">
              <div class="ccPanelBody">
                <div class="arDetailsSection">
                  <div class="ccFieldGrid arDetailsGrid">
                    <label class="ccLabel arDetailsLabel" for="ccNameInput">Name : </label>
                    <div class="ccFieldControl arDetailsField">
                      <input class="ccInput arDetailsControl" id="ccNameInput" type="text">
                    </div>
                    <label class="ccLabel arDetailsLabel" for="ccOutputTypeInput">Output Type : </label>
                    <div class="ccFieldControl arDetailsField withPicker">
                      <input class="ccInput arDetailsControl" id="ccOutputTypeInput" type="text">
                      <button class="ccIconButton" id="ccOutputTypeBtn" type="button" title="Select output type" aria-label="Select output type">...</button>
                    </div>
                    <label class="ccLabel arDetailsLabel" data-details-field="project" for="ccProjectInput">Project : </label>
                    <div class="ccFieldControl arDetailsField" data-details-field="project">
                      <input class="ccInput arDetailsControl" id="ccProjectInput" type="text" readonly>
                    </div>
                    <label class="ccLabel arDetailsLabel" for="ccClassInput">Segment : </label>
                    <div class="ccFieldControl arDetailsField">
                      <input class="ccInput arDetailsControl" id="ccClassInput" type="text" readonly>
                    </div>
                  </div>
                </div>

                <div class="arDetailsSection">
                  <div class="ccFieldGrid arDetailsGrid">
                    <!-- Latest, Exposure and Prior Ultimate are chosen on the
                         Data Flow map; these hold the chosen names. -->
                    <input id="ccLatestInput" type="hidden">
                    <input id="ccExposureInput" type="hidden">
                    <input id="ccPriorUltimateInput" type="hidden">
                    <label class="ccLabel arDetailsLabel" for="ccPriorModeButton">Prior Ultimate Type : </label>
                    <div class="arDetailsField">
                      <div class="ccPriorModeDropdown" id="ccPriorModeDropdown">
                        <button class="ccDropdownButton" id="ccPriorModeButton" type="button" aria-haspopup="listbox" aria-controls="ccPriorModeMenu" aria-expanded="false" aria-label="Prior ultimate mode">
                          <span id="ccPriorModeLabel">Latest / Ultimates</span>
                          <span class="ccDropdownCaret" aria-hidden="true"></span>
                        </button>
                        <div class="ccDropdownMenu" id="ccPriorModeMenu" role="listbox" aria-label="Prior ultimate mode">
                          <button class="ccDropdownOption" type="button" role="option" data-value="latest_ultimates" aria-selected="true">Latest / Ultimates</button>
                          <button class="ccDropdownOption" type="button" role="option" data-value="pattern" aria-selected="false">Pattern</button>
                        </div>
                      </div>
                    </div>
                    <label class="arDetailsLabel" id="ccDependenciesLabel">Data Flow : </label>
                    <div class="arDetailsField">
                      <div id="ccDependencyMap" class="arDetailsDepMap" role="group" aria-labelledby="ccDependenciesLabel" aria-live="polite"></div>
                    </div>
                  </div>
                </div>

                <div class="arDetailsSection">
                  <div class="ccFieldGrid arDetailsGrid">
                    <label class="ccLabel arDetailsLabel" for="ccOriginLengthButton">Origin Length : </label>
                    <div class="ccFieldControl arDetailsField arDetailsShortField">
                      <div class="ccOriginLengthDropdown" id="ccOriginLengthDropdown">
                        <input id="ccOriginLengthInput" type="hidden" value="12">
                        <button class="ccDropdownButton ccOriginLengthButton" id="ccOriginLengthButton" type="button" aria-haspopup="listbox" aria-controls="ccOriginLengthMenu" aria-expanded="false">
                          <span id="ccOriginLengthLabel">12</span>
                          <span class="ccDropdownCaret" aria-hidden="true"></span>
                        </button>
                        <div class="ccDropdownMenu" id="ccOriginLengthMenu" role="listbox" aria-label="Origin Length">
                          <button class="ccDropdownOption" type="button" role="option" data-value="12" aria-selected="true">12</button>
                          <button class="ccDropdownOption" type="button" role="option" data-value="6" aria-selected="false">6</button>
                          <button class="ccDropdownOption" type="button" role="option" data-value="3" aria-selected="false">3</button>
                          <button class="ccDropdownOption" type="button" role="option" data-value="1" aria-selected="false">1</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </section>

        <section class="ccPage" id="ccMethodPage" data-page="method" role="tabpanel">
          <div class="ccMethodToolbar">
            <div class="ccToolGroup">
              <span class="ccToolTitle">Trend</span>
              <div class="ccToolControls">
                <span class="ccToolField">
                  <label class="ccToolControlLabel" for="ccTrendRateInput">Trend Rate % : </label>
                  <input class="ccTrendRateInput" id="ccTrendRateInput" type="text" inputmode="decimal" autocomplete="off">
                </span>
                <button class="ccButton ccFitBtn" id="ccFitBtn" type="button">Fit</button>
                <label class="ccToolCheck"><input id="ccAutoFitInput" type="checkbox"> Auto Fit</label>
                <span class="ccToolField">
                  <label class="ccToolControlLabel" for="ccDecayInput">Decay Factor : </label>
                  <span class="ccNumberStepper">
                    <input id="ccDecayInput" class="ccStepperInput" type="number" min="0" max="1" step="0.05" value="0">
                    <span class="ccStepperButtons">
                      <button id="ccDecayUp" class="ccStepperBtn" type="button" aria-label="Increase decay factor"><span class="ccStepperCaret ccStepperCaretUp" aria-hidden="true"></span></button>
                      <button id="ccDecayDown" class="ccStepperBtn" type="button" aria-label="Decrease decay factor"><span class="ccStepperCaret" aria-hidden="true"></span></button>
                    </span>
                  </span>
                </span>
              </div>
            </div>
            <div class="ccToolGroup">
              <span class="ccToolTitle">Display</span>
              <div class="ccToolControls">
                <span class="ccToolField">
                  <label class="ccToolControlLabel" for="ccScalingButton">Scaling : </label>
                  <div class="ccScalingDropdown" id="ccScalingDropdown">
                    <button class="ccDropdownButton" id="ccScalingButton" type="button" aria-haspopup="listbox" aria-controls="ccScalingMenu" aria-expanded="false" aria-label="Ratio scaling">
                      <span id="ccScalingLabel">Percentage</span>
                      <span class="ccDropdownCaret" aria-hidden="true"></span>
                    </button>
                    <div class="ccDropdownMenu" id="ccScalingMenu" role="listbox" aria-label="Ratio scaling">
                      <button class="ccDropdownOption" type="button" role="option" data-value="percentage" aria-selected="true">Percentage</button>
                      <button class="ccDropdownOption" type="button" role="option" data-value="unscaled" aria-selected="false">Unscaled</button>
                      <button class="ccDropdownOption" type="button" role="option" data-value="auto_scaled" aria-selected="false">Auto-scaled</button>
                    </div>
                  </div>
                </span>
                <span class="ccToolField">
                  <label class="ccToolControlLabel" for="ccMethodDecimalsInput">Decimal Places : </label>
                  <span class="ccNumberStepper">
                    <input id="ccMethodDecimalsInput" class="ccStepperInput" type="number" min="0" max="8" step="1" value="2">
                    <span class="ccStepperButtons">
                      <button id="ccMethodDecimalsUp" class="ccStepperBtn" type="button" aria-label="Increase decimal places"><span class="ccStepperCaret ccStepperCaretUp" aria-hidden="true"></span></button>
                      <button id="ccMethodDecimalsDown" class="ccStepperBtn" type="button" aria-label="Decrease decimal places"><span class="ccStepperCaret" aria-hidden="true"></span></button>
                    </span>
                  </span>
                </span>
                <label class="ccToolCheck"><input id="ccAltUltimateInput" type="checkbox" disabled> Alternative Ultimate Calculation</label>
              </div>
            </div>
          </div>
          <div class="ccTableWrap">
            <table class="ccMethodTable arSpreadsheetTable" aria-label="Cape Cod method table" tabindex="0">
              <colgroup id="ccMethodCols"></colgroup>
              <thead id="ccMethodHead"></thead>
              <tbody id="ccMethodGrid"></tbody>
            </table>
          </div>
        </section>

        <section class="ccPage" id="ccUltimatesPage" data-page="ultimates" role="tabpanel">
          <div class="ccTableWrap ccUltimatesWrap">
            <table class="ccUltimatesTable arSpreadsheetTable" aria-label="Cape Cod ultimates triangle" tabindex="0">
              <colgroup id="ccUltimatesCols"></colgroup>
              <thead id="ccUltimatesHead"></thead>
              <tbody id="ccUltimatesGrid"></tbody>
            </table>
            <div class="ccUltimatesEmpty" id="ccUltimatesEmpty">Select source data to view the as-if ultimates triangle.</div>
          </div>
        </section>

        <section class="ccPage" id="ccRatiosPage" data-page="ratios" role="tabpanel">
          <section class="ccChartPanel" aria-labelledby="ccChartTitle">
            <header class="ccChartHeader">
              <div class="ccChartHeading">
                <h2 class="ccChartTitle" id="ccChartTitle">Ratios</h2>
                <p class="ccChartSubtitle">Cape Cod ratio series by origin period</p>
              </div>
              <div class="ccChartLegend" id="ccChartLegend" aria-label="Chart legend"></div>
            </header>
            <div class="ccChartPlot">
              <canvas class="ccChartCanvas" id="ccChartCanvas" role="img"></canvas>
              <div class="ccChartEmpty" id="ccChartEmpty">Select source data to plot ratio series.</div>
              <div class="ccChartTooltip" id="ccChartTooltip" role="status" hidden></div>
            </div>
          </section>
        </section>

        <section class="ccPage" id="ccNotesPage" data-page="notes" role="tabpanel">
          <div id="ccNotesMount"></div>
        </section>

        <section class="ccPage" id="ccAuditPage" data-page="audit" role="tabpanel">
          <div id="ccAuditLogMount"></div>
        </section>
      </div>
    </section>

    <footer class="ccSaveBar" id="ccSaveBar">
      <div class="ccSaveActions">
        <button class="ccButton primary" id="ccSaveBtn" type="button">Save</button>
        <button class="ccButton" id="ccCancelBtn" type="button">Cancel</button>
      </div>
    </footer>
  </main>

  <div class="ccCellContextMenu" id="ccCellContextMenu" role="menu" aria-hidden="true">
    <button type="button" role="menuitem" data-cc-cell-action="copy">Copy values</button>
    <button type="button" role="menuitem" data-cc-cell-action="paste">Paste values</button>
    <button type="button" role="menuitem" data-cc-cell-action="clear-override">Clear Trend Factor Override</button>
    <button type="button" role="menuitem" data-cc-cell-action="remove-highlights">Remove Highlights</button>
    <button type="button" role="menuitem" data-cc-cell-action="table-colors" data-table-colors></button>
  </div>

  <script src="/ui/shared/tabbed_page/initial_tab_paint.js?v=20260824d" data-auto="1"></script>
  <script type="module" src="/ui/method_pages/cape_cod/cape_cod_main.js?v=20261020a"></script>
</body>
</html>
