<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/ui/shared/services/color_theme.js?v=20260923c"></script>
  <title>Result Selection</title>
  <link rel="stylesheet" href="/ui/shared/tabbed_page/tabbed_page.css?v=20260824d"/>
  <link rel="stylesheet" href="/ui/shared/tabs/details/details_form_layout.css?v=20260820b"/>
<link rel="stylesheet" href="/ui/shared/styles/dependency_families.css?v=20261020a"/>
<link rel="stylesheet" href="/ui/shared/tabs/details/details_dependencies.css?v=20261020c"/>
  <link rel="stylesheet" href="/ui/shared/tabs/notes/notes_tab.css?v=20260911a"/>
  <link rel="stylesheet" href="/ui/shared/styles/scrollbars.css?v=20260516a"/>
  <link rel="stylesheet" href="/ui/shared/components/spreadsheet/spreadsheet_table.css?v=20260927c"/>
  <link rel="stylesheet" href="/ui/shared/components/spreadsheet/table_colors_window.css?v=20261003a"/>
  <link rel="stylesheet" href="/ui/shared/components/workspace/workspace.css?v=20260721a"/>
  <link rel="stylesheet" href="/ui/shared/components/context_menu/context_menu.css?v=20260715a"/>
  <link rel="stylesheet" href="/ui/shared/components/chart_legend/chart_legend.css?v=20260724b"/>
  <link rel="stylesheet" href="/ui/method_pages/result_selection/result_selection.css?v=20261021a"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/light.css?v=20260923c"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/dark.css?v=20260923c"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/revolutionary.css?v=20260923c"/>
</head>
<body data-arcrho-page-hold="1">
  <div class="rsTabBar tabbedPageTabBar" id="rsTabBar">
    <button class="rsTab tabbedPageTab active" data-page="details" type="button">Details</button>
    <button class="rsTab tabbedPageTab" data-page="method" type="button">Method</button>
    <button class="rsTab tabbedPageTab" data-page="chart" type="button">Chart</button>
    <button class="rsTab tabbedPageTab" data-page="results" type="button">Results</button>
    <button class="rsTab tabbedPageTab" data-page="validation" type="button">Validation</button>
    <button class="rsTab tabbedPageTab" data-page="notes" type="button">Notes</button>
    <button class="rsTab tabbedPageTab" data-page="audit" type="button">Audit Log</button>
  </div>
  <div class="rsPageHost">
    <section id="rsDetailsPage" data-page="details" class="rsPage arDetailsRoot active">
      <!-- Identity, then the datasets the selection is built from, then the
           shape of the output. Name is the first row and Output Type the
           second, as on every Details tab. -->
      <div class="rsDetailsBlock">
        <div class="arDetailsSection">
          <div class="rsDetailsGrid arDetailsGrid">
            <label class="arDetailsLabel" for="rsNameInput">Name : </label>
            <div class="rsFieldRow arDetailsField">
              <input id="rsNameInput" class="rsInput arDetailsControl" type="text" autocomplete="off"/>
            </div>
            <label class="arDetailsLabel" for="rsOutputTypeInput">Output Type : </label>
            <div class="rsFieldRow arDetailsField">
              <div class="rsInputPicker">
                <input id="rsOutputTypeInput" class="rsInput arDetailsControl" type="text" autocomplete="off"/>
                <button id="rsOutputTypeBtn" class="rsButton rsInputPickerBtn" type="button" title="Select output type">...</button>
              </div>
            </div>
          </div>
        </div>

        <div class="arDetailsSection">
          <div class="rsDetailsGrid arDetailsGrid">
            <label class="rsBasisLabel arDetailsLabel" for="rsRatioBasisAddBtn">Ratio Basis : </label>
            <div class="rsFieldRow arDetailsField">
              <div class="rsRatioBasisPicker">
                <div id="rsRatioBasisList" class="rsRatioBasisList" role="list" aria-live="polite"></div>
                <button id="rsRatioBasisAddBtn" class="rsRatioBasisAdd" type="button" aria-label="Add ratio basis">+ Add datasets</button>
                <input id="rsRatioBasisInput" type="hidden"/>
                <input id="rsRatioBasisInput2" type="hidden"/>
                <input id="rsRatioBasisInput3" type="hidden"/>
                <input id="rsStatisticDecimalsInput" type="hidden" value="1"/>
              </div>
            </div>
            <label class="arDetailsLabel" id="rsDependenciesLabel">Dependencies : </label>
            <div class="arDetailsField">
              <div id="rsDependencyMap" class="arDetailsDepMap" role="group" aria-labelledby="rsDependenciesLabel" aria-live="polite"></div>
            </div>
          </div>
        </div>

        <div class="arDetailsSection">
          <div class="rsDetailsGrid arDetailsGrid">
            <label class="arDetailsLabel" for="rsOriginLengthButton">Origin Length : </label>
            <div class="rsFieldRow arDetailsField arDetailsShortField">
              <select id="rsOriginLengthInput" class="rsSelect rsOriginLengthSelect rsNativeSelectHidden" tabindex="-1" aria-hidden="true">
                <option value="12">12</option>
                <option value="6">6</option>
                <option value="3">3</option>
                <option value="1">1</option>
              </select>
              <div id="rsOriginLengthDropdown" class="rsDropdown rsOriginLengthDropdown">
                <button id="rsOriginLengthButton" class="rsDropdownButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Origin length">
                  <span id="rsOriginLengthLabel" class="rsDropdownLabel">12</span>
                  <span class="rsDropdownCaret" aria-hidden="true"></span>
                </button>
                <div id="rsOriginLengthMenu" class="rsDropdownMenu" role="listbox" aria-label="Origin length">
                  <button class="rsDropdownOption" type="button" role="option" data-value="12" aria-selected="true">12</button>
                  <button class="rsDropdownOption" type="button" role="option" data-value="6" aria-selected="false">6</button>
                  <button class="rsDropdownOption" type="button" role="option" data-value="3" aria-selected="false">3</button>
                  <button class="rsDropdownOption" type="button" role="option" data-value="1" aria-selected="false">1</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section id="rsMethodPage" data-page="method" class="rsPage">
      <div class="rsMethodToolbar">
        <div class="rsToolGroup rsToolGroupWide">
          <span class="rsToolTitle">Weights</span>
          <div class="rsToolControls">
            <label class="rsToolCheck"><input id="rsShowWeightsInput" type="checkbox" checked/> Show Weights</label>
            <div class="rsToolFormatControl">
              <label class="rsToolControlLabel" for="rsWeightDisplayButton">Format : </label>
              <div id="rsWeightDisplayDropdown" class="rsDropdown rsWeightDisplayDropdown">
                <button id="rsWeightDisplayButton" class="rsDropdownButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Weight display mode">
                  <span id="rsWeightDisplayLabel" class="rsDropdownLabel">Index</span>
                  <span class="rsDropdownCaret" aria-hidden="true"></span>
                </button>
                <div id="rsWeightDisplayMenu" class="rsDropdownMenu" role="listbox" aria-label="Weight display mode">
                  <button class="rsDropdownOption" type="button" role="option" data-value="actual" aria-selected="true">Index</button>
                  <button class="rsDropdownOption" type="button" role="option" data-value="effective" aria-selected="false">Effective %</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="rsToolGroup rsToolGroupWide">
          <span class="rsToolTitle">Statistics</span>
          <div class="rsToolControls">
            <label class="rsToolCheck"><input id="rsShowRatiosPctInput" type="checkbox" checked/> Show Ratios as Percentages</label>
            <div class="rsToolDecimalControl">
              <label class="rsToolControlLabel" for="rsMethodStatisticDecimalsInput">Decimal : </label>
              <span class="rsNumberStepper">
                <input id="rsMethodStatisticDecimalsInput" class="rsNumber rsStepperInput" type="number" min="0" max="8" step="1" value="1"/>
                <span class="rsStepperButtons">
                  <button id="rsMethodStatisticDecimalsUp" class="rsStepperBtn" type="button" aria-label="Increase statistic decimal places">
                    <span class="rsStepperCaret rsStepperCaretUp" aria-hidden="true"></span>
                  </button>
                  <button id="rsMethodStatisticDecimalsDown" class="rsStepperBtn" type="button" aria-label="Decrease statistic decimal places">
                    <span class="rsStepperCaret" aria-hidden="true"></span>
                  </button>
                </span>
              </span>
            </div>
          </div>
        </div>
        <div class="rsToolGroup rsToolGroupBasis">
          <span class="rsToolTitle">Ratio Basis</span>
          <div class="rsToolControls">
            <div id="rsActiveRatioBasisDropdown" class="rsDropdown rsRatioBasisDropdown">
              <button id="rsActiveRatioBasisButton" class="rsDropdownButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Active ratio basis">
                <span id="rsActiveRatioBasisLabel" class="rsDropdownLabel">No basis</span>
                <span class="rsDropdownCaret" aria-hidden="true"></span>
              </button>
              <div id="rsActiveRatioBasisMenu" class="rsDropdownMenu" role="listbox" aria-label="Active ratio basis">
                <button class="rsDropdownOption" type="button" role="option" data-value="" aria-selected="true">No basis</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="rsGridHost">
        <table class="rsGrid arSpreadsheetTable" id="rsMethodGrid" aria-label="Result Selection method table"></table>
      </div>
    </section>
    <section id="rsChartPage" data-page="chart" class="rsPage" role="tabpanel">
      <section class="rsChartPanel" aria-label="Dataset Vectors">
        <div class="rsChartToolbar" role="toolbar" aria-label="Chart tools">
          <span class="rsChartToolLabel">Mode</span>
          <div class="rsChartSegment" role="group" aria-label="Chart mode">
            <button id="rsChartModeWeights" type="button" aria-pressed="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 13h10M5 13V8M8 13V4M11 13V6.5"/></svg>Edit Weights
            </button>
            <button id="rsChartModeZoom" type="button" aria-pressed="false">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2 13.5 13.5M5.3 7h3.4M7 5.3v3.4"/></svg>Zoom
            </button>
          </div>
          <span class="rsChartToolSeparator" aria-hidden="true"></span>
          <label class="rsChartToolCheck"><input id="rsChartShowStrip" type="checkbox" checked/> Weight Strip</label>
          <span class="rsChartToolSpacer"></span>
          <button id="rsChartFullView" class="rsChartToolButton" type="button" disabled>Full View</button>
        </div>
        <div class="rsChartBody" id="rsChartBody">
          <div class="rsChartPlot">
            <canvas class="rsChartCanvas" id="rsChartCanvas" role="img" tabindex="0"></canvas>
            <div class="rsChartEmpty" id="rsChartEmpty">Add a source dataset to plot vectors.</div>
            <div class="rsChartZoomBox" id="rsChartZoomBox" hidden></div>
            <div class="rsChartTooltip" id="rsChartTooltip" role="status" hidden></div>
            <div class="rsChartSideResizer" id="rsChartSideResizer" role="separator" aria-orientation="vertical" aria-label="Resize side panel" tabindex="0" title="Drag to resize; double-click to reset"></div>
            <div class="rsChartSelectionBar" id="rsChartSelectionBar" role="group" aria-label="Selected points" hidden>
              <span class="rsChartSelectionCount" id="rsChartSelectionCount"></span>
              <input id="rsChartSelectionWeight" class="rsChartSelectionWeight" type="number" min="0" step="1" value="1.0" aria-label="Weight for the selected points"/>
              <button id="rsChartSelectionSet" class="rsChartToolButton rsChartPrimaryButton" type="button">Set Weight</button>
              <button id="rsChartSelectionOnly" class="rsChartToolButton" type="button" title="The selected points get this weight and every other method in their origins gets 0">Use Only These</button>
              <button id="rsChartSelectionExclude" class="rsChartToolButton" type="button">Exclude</button>
              <button id="rsChartSelectionClose" class="rsChartIconButton" type="button" aria-label="Clear selection">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
              </button>
            </div>
          </div>
          <aside class="arChartLegendPanel rsChartSide" id="rsChartSide" aria-labelledby="rsChartLegendTitle">
            <section class="rsChartInspector" aria-labelledby="rsChartInspectorTitle">
              <div class="rsChartInspectorHeader">
                <h3 class="rsChartInspectorTitle" id="rsChartInspectorTitle">Origin</h3>
                <span class="rsChartInspectorNav">
                  <button id="rsChartInspectorPrev" class="rsChartIconButton" type="button" aria-label="Previous origin">
                    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7.5 2.5 4 6l3.5 3.5"/></svg>
                  </button>
                  <button id="rsChartInspectorNext" class="rsChartIconButton" type="button" aria-label="Next origin">
                    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>
                  </button>
                </span>
              </div>
              <table class="rsChartInspectorTable">
                <thead><tr><th>Method</th><th>Value</th><th>Weight</th><th>Eff.</th></tr></thead>
                <tbody id="rsChartInspectorBody"></tbody>
              </table>
              <div class="rsChartInspectorUltimate">
                <span>Selected Ultimate</span>
                <span class="rsChartInspectorUltimateValue" id="rsChartInspectorUltimate"></span>
                <span class="rsChartInspectorCalculated" id="rsChartInspectorCalculated"></span>
                <button id="rsChartInspectorRevert" class="rsChartLinkButton" type="button" hidden>Revert To Calculated</button>
              </div>
            </section>
            <div class="arChartLegendHeader">
              <h3 class="arChartLegendTitle" id="rsChartLegendTitle">Columns</h3>
              <span class="arChartLegendCount" id="rsChartLegendCount"></span>
            </div>
            <div class="arChartLegendList" id="rsChartLegendList" role="group" aria-label="Chart column visibility"></div>
          </aside>
        </div>
      </section>
    </section>
    <section id="rsResultsPage" data-page="results" class="rsPage">
      <div class="rsGridHost rsResultsGridHost">
        <table class="rsGrid arSpreadsheetTable" id="rsResultsGrid" aria-label="Result Selection results table"></table>
      </div>
    </section>
    <section id="rsValidationPage" data-page="validation" class="rsPage">
      <div class="rsPlaceholder">Validation tab placeholder for Result Selection.</div>
    </section>
    <section id="rsNotesPage" data-page="notes" class="rsPage">
      <div id="rsNotesMount"></div>
    </section>
    <section id="rsAuditPage" data-page="audit" class="rsPage" role="tabpanel">
      <div id="rsAuditLogMount"></div>
    </section>
  </div>
  <div class="rsSaveBar">
    <span class="rsHistoryButtons" role="group" aria-label="Undo history">
      <button id="rsUndoBtn" class="rsHistoryBtn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5.5 4 2.5 7l3 3"/><path d="M3 7h6.5a3.5 3.5 0 0 1 0 7H8"/></svg>
      </button>
      <button id="rsRedoBtn" class="rsHistoryBtn" type="button" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10.5 4l3 3-3 3"/><path d="M13 7H6.5a3.5 3.5 0 0 0 0 7H8"/></svg>
      </button>
    </span>
    <button id="rsSaveBtn" class="rsSaveBtn is-clean" type="button" disabled>Save</button>
    <button id="rsCancelBtn" class="rsCancelBtn" type="button" disabled>Cancel</button>
  </div>
  <div id="rsCellContextMenu" class="rsCellContextMenu" aria-hidden="true">
    <button type="button" data-rs-cell-action="copy-values">Copy</button>
    <button type="button" data-rs-cell-action="paste-values">Paste</button>
    <button type="button" data-rs-cell-action="remove-highlights">Remove Highlights</button>
    <button type="button" data-rs-cell-action="table-colors" data-table-colors></button>
    <button type="button" data-rs-cell-action="revert-ultimate" data-rs-ultimate-action hidden>Revert Ultimate Value</button>
    <button type="button" data-rs-cell-action="revert-all-ultimate" data-rs-ultimate-action hidden>Revert All Ultimate Values</button>
  </div>
  <div id="rsSourceContextMenu" class="rsCellContextMenu" aria-hidden="true">
    <button type="button" data-rs-source-action="view-edit">View/Edit</button>
    <button type="button" data-rs-source-action="add">Add</button>
    <button type="button" data-rs-source-action="delete">Delete</button>
  </div>
  <div id="rsChartMenu" class="rsCellContextMenu rsChartMenu" role="menu" aria-hidden="true"></div>
  <div id="rsRatioBasisContextMenu" class="rsCellContextMenu rsRatioBasisContextMenu" role="menu" aria-hidden="true">
    <button type="button" role="menuitem" data-rs-ratio-basis-action="delete">Delete</button>
  </div>
  <script src="/ui/shared/tabbed_page/initial_tab_paint.js?v=20260824d" data-auto="1"></script>
  <script src="/ui/method_pages/result_selection/result_selection_ui.js?v=20261020a"></script>
  <script src="/ui/method_pages/result_selection/result_selection_data.js?v=20261020a"></script>
  <script src="/ui/method_pages/result_selection/result_selection_grids.js?v=20261020a"></script>
  <script src="/ui/method_pages/result_selection/result_selection_model.js?v=20261020a"></script>
  <script type="module" src="/ui/method_pages/result_selection/result_selection_main.js?v=20261020b"></script>
</body>
</html>
