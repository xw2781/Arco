<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/ui/shared/services/color_theme.js?v=20260923c"></script>
  <title>Dependency Graph</title>
  <link rel="stylesheet" href="/ui/shared/styles/framed_scrollbars.css?v=20260824a"/>
  <link rel="stylesheet" href="/ui/shared/components/context_menu/context_menu.css?v=20260811b"/>
  <link rel="stylesheet" href="/ui/shared/styles/pi_table.css?v=20260819a"/>
  <link rel="stylesheet" href="/ui/shared/styles/dependency_families.css?v=20261020a"/>
  <link rel="stylesheet" href="/ui/project_instance/dependency_graph_window.css?v=20261020a"/>
  <link rel="stylesheet" href="/ui/project_instance/dependency_graph_filters.css?v=20260920d"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/light.css?v=20260923c"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/dark.css?v=20260923c"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/revolutionary.css?v=20260923c"/>
</head>
<body class="pi-dependency-graph-page">
  <div class="pi-dependency-graph-body">
    <div class="pi-dependency-graph-toolbar">
      <input class="pi-dependency-graph-search" id="dependencyGraphSearch" type="search" placeholder="Find a dataset" aria-label="Find a dataset in the graph" autocomplete="off" spellcheck="false"/>
      <div class="pi-dependency-graph-filter-group">
        <div class="pi-dependency-graph-filters" id="dependencyGraphFilters" aria-label="Dependency chain filters"></div>
        <label class="pi-dependency-graph-check">
          <input id="dependencyGraphMatchedOnly" type="checkbox" checked/>
          <span>Show matched items only</span>
        </label>
      </div>
      <div class="pi-dependency-graph-legend" aria-label="Node families">
        <span data-family="dataset">Dataset</span>
        <span data-family="calculated">Calculated</span>
        <span data-family="engine">Imported</span>
        <span data-family="generated">Generated</span>
        <span data-family="method">Method</span>
      </div>
      <button class="pi-dependency-graph-icon-btn" id="dependencyGraphZoomOut" type="button" data-icon="zoom-out" aria-label="Zoom out"></button>
      <button class="pi-dependency-graph-icon-btn" id="dependencyGraphZoomIn" type="button" data-icon="zoom-in" aria-label="Zoom in"></button>
      <button class="pi-dependency-graph-icon-btn" id="dependencyGraphFit" type="button" data-icon="fit" aria-label="Fit the whole graph in the window"></button>
      <button class="pi-dependency-graph-icon-btn" id="dependencyGraphRefresh" type="button" data-icon="refresh" aria-label="Refresh the dependency graph"></button>
    </div>
    <div class="pi-dependency-graph-canvas" id="dependencyGraphCanvas">
      <svg class="pi-dependency-graph-svg" id="dependencyGraphSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dependency graph"></svg>
      <div class="pi-dependency-graph-state" id="dependencyGraphState" hidden></div>
    </div>
    <div class="pi-dependency-graph-status" id="dependencyGraphStatus" aria-live="polite"></div>
  </div>
  <div class="ctx-menu pi-dependency-graph-menu" id="dependencyGraphMenu" role="menu" aria-label="Graph box actions">
    <div class="ctx-menu-inner">
      <button class="ctx-item" type="button" role="menuitem" data-action="open">Show Dataset</button>
      <button class="ctx-item" type="button" role="menuitem" data-action="set-reviewed">Set Reviewed</button>
      <button class="ctx-item" type="button" role="menuitem" data-action="view-in-table">View in Dataset Table</button>
    </div>
  </div>
  <script type="module" src="/ui/project_instance/dependency_graph_window.js?v=20261020a"></script>
</body>
</html>
